name: Build and Export Image File

on:
  push:
    branches: ['main']

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Build directly for arm64 and output as a tar archive
      - name: Build and Export OCI Archive
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Containerfile
          platforms: linux/arm64
          outputs: type=docker,dest=./my-app.tar
          tags: my-app:latest

      # Upload the tar file to GitHub Actions Artifacts
      - name: Upload Image Artifact
        uses: actions/upload-artifact@v4
        with:
          name: arm64-docker-image
          path: ./my-app.tar
