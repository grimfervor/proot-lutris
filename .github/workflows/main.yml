name: Build and Export Container Image Tar

on:
  push:
    branches:
      - main
  workflow_dispatch: # Allows you to trigger the build manually from the Actions tab

jobs:
  build-tar:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Build for arm64 and output directly to a tar file
      - name: Build and Export Image to .tar
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Containerfile # Change to ./Dockerfile if your file is named Dockerfile
          platforms: linux/arm64
          outputs: type=docker,dest=./gamebox.tar
          tags: gamebox:latest

      # REQUIRED: Upload the .tar file as a downloadable GitHub Action artifact
      - name: Upload .tar Artifact
        uses: actions/upload-artifact@v4
        with:
          name: gamebox-arm64-tar
          path: ./gamebox.tar
          retention-days: 7
