name: Build and Release Gamebox Package

on:
  push:
    tags:
      - 'v*' # Triggers on tag pushes like v1.0.0, v2.1.0, etc.

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Grants permission to create releases and upload assets

    steps:
      # Step 1: Check out source code
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step 2: Build gamebox.tar
      # Replace 'path/to/files' with the actual folder or files you want to archive
      - name: Create gamebox.tar Archive
        run: |
          tar -cvf gamebox.tar path/to/files

      # Step 3: Create GitHub Release & Upload gamebox.tar
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Release ${{ github.ref_name }}"
          generate_release_notes: true  # Auto-generates description from commits/PRs
          files: gamebox.tar            # Attaches your archive
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
